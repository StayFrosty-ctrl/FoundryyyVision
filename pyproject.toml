[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundryvision"
version = "0.1.0"
description = "Real-time multi-object video tracking, identity, activity recognition, and sports scouting platform for Baseball and American Football."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FoundryyyVision Contributors" }
]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
    "ultralytics>=8.2.0",
    "boxmot>=10.0.0",
    "supervision>=0.20.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
foundryvision = "foundryvision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foundryvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
